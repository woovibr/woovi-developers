<style>
/* Layout: a single developer page; four chapters (descobrir → sequência → estados+playground) share one simulated charge. */
:root {
  --bg: #F3F6F5;
  --surface: #FFFFFF;
  --surface-2: #EAF0EE;
  --ink: #0D1A16;
  --muted: #56675F;
  --line: #D3DDD9;
  --grid: #D9E2DE;
  --accent: #03976F;
  --accent-strong: #027A5A;
  --accent-soft: #DDF5EC;
  --accent-ink: #FFFFFF;
  --warn: #9A5B00;
  --warn-soft: #FFF0D6;
  --bad: #B8322A;
  --bad-soft: #FCE5E2;
  --code-bg: #0E1916;
  --code-fg: #D3E6DF;
  --code-dim: #7F9A91;
  --code-key: #7EE2BF;
  --code-str: #F2C98A;
  --shadow: 0 1px 2px rgba(13,26,22,.06), 0 4px 16px rgba(13,26,22,.05);

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A110F; --surface: #111B18; --surface-2: #16231F; --ink: #E4EEEA; --muted: #8FA49C;
    --line: #23332E; --grid: #1C2925; --accent: #2BE0A2; --accent-strong: #5CF0BD; --accent-soft: #0F3227;
    --accent-ink: #03140E; --warn: #F3B451; --warn-soft: #33250C; --bad: #FF7B70; --bad-soft: #3A1714;
    --code-bg: #060C0A; --code-fg: #D3E6DF; --code-dim: #6E8880; --code-key: #7EE2BF; --code-str: #F2C98A;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A110F; --surface: #111B18; --surface-2: #16231F; --ink: #E4EEEA; --muted: #8FA49C;
  --line: #23332E; --grid: #1C2925; --accent: #2BE0A2; --accent-strong: #5CF0BD; --accent-soft: #0F3227;
  --accent-ink: #03140E; --warn: #F3B451; --warn-soft: #33250C; --bad: #FF7B70; --bad-soft: #3A1714;
  --code-bg: #060C0A; --code-fg: #D3E6DF; --code-dim: #6E8880; --code-key: #7EE2BF; --code-str: #F2C98A;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 0 80px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(34px, 6vw, 58px); font-weight: 800; line-height: 1.02; }
h2 { font-size: clamp(24px, 3.4vw, 32px); font-weight: 700; line-height: 1.15; }
h3 { font-size: 17px; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent-strong); }
code, .mono { font-family: var(--f-mono); font-size: .88em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 64ch; font-size: 16px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-size: 15px; font-weight: 800; }
.brand small { color: var(--muted); font-family: var(--f-mono); font-weight: 400; font-size: 12px; }
.sim-pill { font-family: var(--f-mono); font-size: 11.5px; padding: 4px 10px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.hero { display: grid; gap: 14px; padding-block: 28px 30px; }
.hero h1 em { font-style: normal; color: var(--accent); }

nav.chapters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-inline: -20px; padding-inline: 20px; }
nav.chapters ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; overflow-x: auto; }
nav.chapters a { display: flex; gap: 8px; align-items: baseline; padding: 12px 12px; text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; }
nav.chapters a:hover { color: var(--ink); }
nav.chapters a.on { color: var(--ink); border-bottom-color: var(--accent); }
nav.chapters .n { font-family: var(--f-mono); font-size: 11px; color: var(--accent-strong); }

section.ch { padding-block: 56px 0; display: grid; gap: 22px; scroll-margin-top: 56px; }
.ch-head { display: grid; gap: 8px; }

/* generic */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.btn { font: inherit; font-weight: 600; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; }
.chip { font-family: var(--f-mono); font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip.post { background: var(--accent-soft); color: var(--accent-strong); }
.chip.evt { background: var(--warn-soft); color: var(--warn); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface); flex-wrap: wrap; }
.seg button { font: inherit; font-size: 13px; font-weight: 500; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }

/* code */
.code { background: var(--code-bg); color: var(--code-fg); border-radius: 8px; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.6; overflow: auto; position: relative; min-width: 0; }
.code pre { margin: 0; padding: 14px 16px; white-space: pre; }
.code .k { color: var(--code-key); } .code .s { color: var(--code-str); } .code .c { color: var(--code-dim); }
.code .copy { position: absolute; top: 8px; right: 8px; font: 500 11px var(--f-mono); background: rgba(255,255,255,.08); color: var(--code-fg); border: 0; border-radius: 5px; padding: 4px 8px; cursor: pointer; }
.code-tabs { display: flex; gap: 2px; background: var(--code-bg); border-radius: 8px 8px 0 0; padding: 6px 6px 0; overflow-x: auto; }
.code-tabs button { font: 500 12px var(--f-mono); background: transparent; color: var(--code-dim); border: 0; padding: 7px 10px; border-radius: 6px 6px 0 0; cursor: pointer; white-space: nowrap; }
.code-tabs button.on { color: var(--code-fg); background: rgba(255,255,255,.06); }
.code-tabs + .code { border-radius: 0 0 8px 8px; }

/* react flow canvases */
.flow { height: 560px; border-radius: var(--r); background-color: var(--surface); background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 18px 18px; border: 1px solid var(--line); min-width: 0; }
.react-flow__attribution { display: none; }
.react-flow__handle { opacity: 0; pointer-events: none; }
.react-flow__edge-text { fill: var(--ink); font-family: var(--f-mono); font-size: 11px; }
.react-flow__edge-textbg { fill: var(--surface); }
.react-flow__controls { box-shadow: var(--shadow); }
.react-flow__controls-button { background: var(--surface); border-bottom-color: var(--line); fill: var(--ink); }
.react-flow__controls-button:hover { background: var(--surface-2); }
.react-flow__controls-button svg { fill: var(--ink); }

/* wizard */
.wiz { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
.wiz-side { display: grid; gap: 14px; }
.qcard { padding: 18px; display: grid; gap: 14px; }
.qcard .qn { font-family: var(--f-mono); font-size: 11.5px; color: var(--accent-strong); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; font: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px; color: var(--ink); }
.opt:hover { border-color: var(--accent); background: var(--accent-soft); }
.opt b { font-weight: 600; }
.opt span { font-size: 13px; color: var(--muted); }
.trail { display: flex; flex-wrap: wrap; gap: 6px; }
.trail button { font: 500 12.5px var(--f-body); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.trail button:hover { border-color: var(--accent); }

.n-q, .n-o, .n-r { font-family: var(--f-body); color: var(--ink); border-radius: 9px; transition: opacity .2s, border-color .2s, background .2s; }
.n-q { width: 230px; padding: 10px 12px; background: var(--surface); border: 1.5px solid var(--line); box-shadow: var(--shadow); }
.n-q .t { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.n-q .q { font-family: var(--f-display); font-weight: 700; font-size: 14.5px; line-height: 1.25; }
.n-q.current { border-color: var(--accent); }
.n-q.locked { opacity: .45; }
.n-o { width: 150px; padding: 7px 10px; background: var(--surface-2); border: 1px solid transparent; font-size: 12.5px; line-height: 1.3; cursor: pointer; }
.n-o.available:hover { border-color: var(--accent); }
.n-o.chosen { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.n-o.dim, .n-o.locked { opacity: .38; }
.n-o .leaf { display: block; font-family: var(--f-mono); font-size: 10px; opacity: .8; margin-top: 2px; }
.n-r { width: 240px; padding: 12px 14px; border: 1.5px dashed var(--line); background: var(--surface); text-align: center; }
.n-r.ready { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }

.recipe { padding: 18px; display: grid; gap: 14px; }
.recipe ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
.recipe li { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 10px; counter-increment: s; }
.recipe li::before { content: counter(s); font-family: var(--f-mono); font-size: 12px; font-weight: 500; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-strong); }
.recipe li b { display: block; font-weight: 600; }
.recipe li p { color: var(--muted); font-size: 13.5px; }
.recipe .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.recipe-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* sequence */
.seq { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 18px; align-items: start; }
.seq-canvas { padding: 10px; overflow-x: auto; }
.seq-canvas svg { display: block; min-width: 640px; width: 100%; height: auto; }
.seq-toolbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.seq-ctrl { display: flex; gap: 6px; align-items: center; }
.seq-ctrl .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; }
svg .actor-box { fill: var(--surface-2); stroke: var(--line); }

svg .msg.future { opacity: .32; }
svg .msg.cur line, svg .msg.cur path { stroke: var(--accent); stroke-width: 2.2; }
svg .msg.cur .lbl { fill: var(--accent-strong); font-weight: 700; }
svg .msg.cur .num { fill: var(--accent-strong); }
svg .msg.bad.past line, svg .msg.bad.cur line { stroke: var(--bad); }
svg .msg.bad .lbl { fill: var(--bad); }
svg .msg.evt .lbl { fill: var(--warn); }
svg .msg.cur.evt line { stroke: var(--warn); }
svg .msg .hit { fill: transparent; cursor: pointer; }
svg .msg:hover .hit { fill: var(--accent-soft); opacity: .5; }
svg .note rect { fill: var(--warn-soft); stroke: none; }
svg .note text { fill: var(--warn); font: 500 11px var(--f-mono); }
svg .arrowhead { fill: var(--muted); }
svg .arrowhead.ink { fill: var(--ink); }

svg .arrowhead.bad { fill: var(--bad); }
svg .arrowhead.warn { fill: var(--warn); }
.step-card { padding: 18px; display: grid; gap: 12px; position: sticky; top: 64px; }
.step-card .who { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.step-card p { color: var(--muted); }
.callout { font-size: 13.5px; border-radius: 8px; padding: 10px 12px; background: var(--accent-soft); color: var(--ink); }
.callout.warn { background: var(--warn-soft); }
.callout.bad { background: var(--bad-soft); }

/* lab: state machine + playground */
.lab { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.lab-col { display: grid; gap: 14px; min-width: 0; }
.form { padding: 18px; display: grid; gap: 14px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.field input, .field select { font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-width: 0; }
.field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.inline { display: flex; gap: 6px; }
.inline input { flex: 1; font-family: var(--f-mono); font-size: 12.5px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions .why { font-size: 12.5px; color: var(--muted); }
.flow.sm { height: 330px; }
.n-s { width: 150px; padding: 12px 12px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); text-align: center; font-family: var(--f-mono); font-weight: 500; font-size: 13.5px; color: var(--ink); transition: all .25s; }
.n-s small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.n-s.terminal { border-width: 3px; border-style: double; }
.n-s.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 0 0 6px var(--accent-soft); }
.n-s.on small { color: var(--accent-ink); opacity: .85; }
.n-s.on.expired { background: var(--muted); border-color: var(--muted); box-shadow: 0 0 0 6px var(--surface-2); color: var(--surface); }
.n-s.on.expired small { color: var(--surface); }
.n-start { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); }
.qr-row { display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 14px; align-items: start; }

.status.ACTIVE { background: var(--accent-soft); color: var(--accent-strong); }
.status.COMPLETED { background: var(--accent); color: var(--accent-ink); }

.log-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.log ul { list-style: none; margin: 0; padding: 0; }
.log li { border-bottom: 1px solid var(--line); }
.log li:last-child { border-bottom: 0; }
.log-row { width: 100%; display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 16px; font: inherit; font-size: 13px; text-align: left; background: transparent; border: 0; color: var(--ink); cursor: pointer; }
.log-row:hover { background: var(--surface-2); }
.log-row .t { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log-row .ok { font-family: var(--f-mono); font-size: 11.5px; color: var(--accent-strong); }
.log-row .ko { font-family: var(--f-mono); font-size: 11.5px; color: var(--bad); }
.log-body { padding: 0 16px 14px; display: grid; gap: 8px; }
.empty { padding: 22px 16px; color: var(--muted); font-size: 13.5px; }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

footer { margin-top: 64px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: flex; gap: 16px; justify-content: space-between; flex-wrap: wrap; }

@media (max-width: 920px) {
  .wiz, .seq, .lab { grid-template-columns: minmax(0, 1fr); }
  .step-card { position: static; }
  .flow { height: 460px; }
}
@media (max-width: 520px) {
  .wrap { padding-inline: 16px; }
  nav.chapters { margin-inline: -16px; padding-inline: 16px; }
  .fields { grid-template-columns: 1fr; }
  .qr-row { grid-template-columns: 1fr; }
  .qr-tile { max-width: 200px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

<body>
<div id="root"></div>
<noscript>Esta página precisa de JavaScript para os diagramas interativos.</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const { useState, useMemo, useEffect, useRef, useCallback } = React;
const html = htm.bind(React.createElement);
const RF = window.ReactFlow;
const Flow = RF.default || RF.ReactFlow;
const { Handle, Position, MarkerType, Controls } = RF;
const DOCS = 'https://developers.woovi.com';

/* ---------- utils ---------- */
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const hex = n => Array.from({ length: n }, () => (Math.random() * 16 | 0).toString(16)).join('');
const brl = cents => (cents / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const tlv = (id, v) => id + String(v.length).padStart(2, '0') + v;
function crc16(str) {
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++) {
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}
function buildBrCode(value, identifier) {
  const body = tlv('00', '01') + tlv('01', '12')
    + tlv('26', tlv('00', 'br.gov.bcb.pix') + tlv('25', 'api.woovi.com/api/testaccount/qr/v1/' + identifier.slice(0, 16)))
    + tlv('52', '0000') + tlv('53', '986') + tlv('54', (value / 100).toFixed(2))
    + tlv('58', 'BR') + tlv('59', 'LOJA EXEMPLO') + tlv('60', 'SAO PAULO')
    + tlv('62', tlv('05', identifier.slice(0, 25))) + '6304';
  return body + crc16(body);
}
function qrSvg(text) {
  try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
  catch (e) { return ''; }
}
function hl(src, lang) {
  // tiny highlighter: strings, comments, json keys
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let out = esc(src);
  if (lang === 'json') {
    out = out.replace(/("[^"]*")(\s*:)/g, '<span class="k">$1</span>$2').replace(/(:\s*)("[^"]*")/g, '$1<span class="s">$2</span>');
  } else {
    out = out.replace(/(\/\/[^\n]*|#[^\n{]*$)/gm, '<span class="c">$1</span>')
      .replace(/('[^'\n]*')/g, '<span class="s">$1</span>');
  }
  return out;
}
function copy(text, btn) {
  const done = ok => { if (btn) { btn.textContent = ok ? 'copiado' : 'selecione e copie'; setTimeout(() => btn.textContent = 'copiar', 1400); } };
  try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch (e) { done(false); }
}
function Code({ src, lang }) {
  return html`<div class="code"><button class="copy" onClick=${e => copy(src, e.currentTarget)}>copiar</button><pre dangerouslySetInnerHTML=${{ __html: hl(src, lang) }}></pre></div>`;
}
function CodeTabs({ tabs, id }) {
  const [on, setOn] = useState(0);
  const t = tabs[Math.min(on, tabs.length - 1)];
  return html`<div style=${{ minWidth: 0 }}>
    <div class="code-tabs" role="tablist">${tabs.map((x, i) => html`<button key=${x.label} role="tab" aria-selected=${i === on} class=${i === on ? 'on' : ''} onClick=${() => setOn(i)}>${x.label}</button>`)}</div>
    <${Code} src=${t.src} lang=${t.lang} />
  </div>`;
}

/* =========================================================
   1. DESCOBRIR — question flow
   ========================================================= */
const QUESTIONS = [
  { id: 'goal', q: 'O que você quer fazer?', opts: [
    { id: 'charge', label: 'Cobrar um pagamento único', hint: 'Pedido, serviço, fatura avulsa' },
    { id: 'recurring', label: 'Cobrar todo mês', hint: 'Assinatura, mensalidade', leaf: true },
    { id: 'store', label: 'Vender numa loja pronta', hint: 'WooCommerce, VTEX, Nuvemshop, Magento', leaf: true },
    { id: 'payout', label: 'Enviar Pix', hint: 'Pagar fornecedor, saque, reembolso', leaf: true },
  ] },
  { id: 'where', q: 'Onde o cliente vai pagar?', opts: [
    { id: 'own', label: 'Na minha tela', hint: 'Eu mostro o QR Code e o copia e cola' },
    { id: 'link', label: 'Na página da Woovi', hint: 'Eu redireciono para o paymentLinkUrl' },
  ] },
  { id: 'confirm', q: 'Como seu sistema fica sabendo do pagamento?', opts: [
    { id: 'webhook', label: 'A Woovi me avisa', hint: 'Webhook OPENPIX:CHARGE_COMPLETED (recomendado)' },
    { id: 'poll', label: 'Eu consulto a API', hint: 'GET /api/v1/charge/{id} de tempos em tempos' },
  ] },
  { id: 'split', q: 'O valor vai para mais de uma conta?', opts: [
    { id: 'no', label: 'Não, fica tudo comigo' },
    { id: 'yes', label: 'Sim, quero dividir', hint: 'Split para subconta ou parceiro' },
  ] },
];

function pathOf(ans) {
  // questions visible on the current path, in order
  const out = [QUESTIONS[0]];
  if (ans.goal !== 'charge') return out;
  return QUESTIONS;
}
function wizardDone(ans) {
  if (!ans.goal) return false;
  if (ans.goal !== 'charge') return true;
  return QUESTIONS.every(q => ans[q.id]);
}

function QNode({ data }) {
  return html`<div class=${'n-q ' + data.state}>
    <${Handle} type="target" position=${Position.Top} />
    <div class="t">Pergunta ${data.n}</div><div class="q">${data.q}</div>
    <${Handle} type="source" position=${Position.Bottom} />
  </div>`;
}
function ONode({ data }) {
  return html`<div class=${'n-o ' + data.state} title=${data.hint || ''}>
    <${Handle} type="target" position=${Position.Top} />
    ${data.label}${data.leaf ? html`<span class="leaf">→ outro guia</span>` : null}
    <${Handle} type="source" position=${Position.Bottom} />
  </div>`;
}
function RNode({ data }) {
  return html`<div class=${'n-r ' + (data.ready ? 'ready' : '')}>
    <${Handle} type="target" position=${Position.Top} />
    <div class="q">Sua integração</div>
    <div class="mono" style=${{ fontSize: 11.5, color: 'var(--muted)' }}>${data.ready ? 'receita pronta ao lado' : 'responda as perguntas'}</div>
  </div>`;
}
const wizNodeTypes = { q: QNode, o: ONode, r: RNode };

function buildWizardGraph(ans) {
  const nodes = [], edges = [];
  const W = 170, ROW = 140;
  const firstUnanswered = QUESTIONS.findIndex(q => !ans[q.id]);
  const onPath = qi => qi === 0 || ans.goal === 'charge';
  QUESTIONS.forEach((q, qi) => {
    const y = qi * ROW;
    const answered = !!ans[q.id];
    const isCurrent = onPath(qi) && !answered && (qi === firstUnanswered);
    const qState = !onPath(qi) ? 'locked' : answered ? 'done' : isCurrent ? 'current' : 'locked';
    nodes.push({ id: 'q-' + q.id, type: 'q', position: { x: 2 * W - 115 + (qi === 0 ? 0 : 0), y }, data: { q: q.q, n: qi + 1, state: qState }, draggable: false });
    const span = q.opts.length * W;
    q.opts.forEach((o, oi) => {
      const x = 2 * W - span / 2 + oi * W + 10;
      const chosen = ans[q.id] === o.id;
      const st = !onPath(qi) ? 'locked' : chosen ? 'chosen' : answered ? 'dim' : isCurrent ? 'available' : 'locked';
      const oid = 'o-' + q.id + '-' + o.id;
      nodes.push({ id: oid, type: 'o', position: { x, y: y + 74 }, data: { ...o, qid: q.id, state: st }, draggable: false });
      edges.push({ id: 'e-' + oid, source: 'q-' + q.id, target: oid, type: 'smoothstep',
        style: { stroke: chosen ? 'var(--accent)' : 'var(--line)', strokeWidth: chosen ? 2 : 1.2 } });
      const next = o.leaf ? null : (QUESTIONS[qi + 1] ? 'q-' + QUESTIONS[qi + 1].id : 'result');
      if (next) edges.push({ id: 'n-' + oid, source: oid, target: next, type: 'smoothstep', animated: chosen,
        markerEnd: { type: MarkerType.ArrowClosed, color: chosen ? '#03976F' : '#9AAAA4', width: 16, height: 16 },
        style: { stroke: chosen ? 'var(--accent)' : 'var(--line)', strokeWidth: chosen ? 2 : 1.2, opacity: st === 'dim' || st === 'locked' ? .5 : 1 } });
    });
  });
  nodes.push({ id: 'result', type: 'r', position: { x: 2 * W - 120, y: QUESTIONS.length * ROW }, data: { ready: wizardDone(ans) && ans.goal === 'charge' }, draggable: false });
  return { nodes, edges };
}

function recipeFor(ans) {
  if (ans.goal === 'recurring') return { title: 'Cobrança recorrente com Pix Automático', steps: [
    { b: 'Escolha a jornada do Pix Automático', p: 'Cada jornada define como o cliente autoriza a recorrência.', links: [['Como escolher a jornada', '/docs/pix-automatic/pix-automatic-how-to-choose-journey']] },
    { b: 'Crie a assinatura pela API', p: 'A Woovi gera as cobranças de cada ciclo.', links: [['Assinatura via API', '/docs/subscription-recurrence/subscription-recurrence-create-api']] },
    { b: 'Acompanhe os eventos de cada ciclo', p: 'Cada cobrança gerada segue a mesma máquina de estados da cobrança avulsa.', links: [['Fluxo e webhooks', '/docs/pix-automatic/webhooks/pix-automatic-flow']] },
  ] };
  if (ans.goal === 'store') return { title: 'Plugin para a sua plataforma', steps: [
    { b: 'Instale o plugin Woovi da sua plataforma', p: 'Há plugins para WooCommerce, VTEX, Nuvemshop, Magento, OpenCart, PrestaShop e outras. Não precisa escrever código.' },
    { b: 'Cole o AppID da sua conta no plugin', p: 'Você gera o AppID em API/Plugins, na plataforma Woovi.' },
    { b: 'Confira se o webhook foi criado', p: 'O plugin cadastra o webhook que atualiza o pedido quando o Pix é pago.' },
  ] };
  if (ans.goal === 'payout') return { title: 'Enviar Pix com a API de pagamentos', steps: [
    { b: 'Entenda o fluxo de um pagamento', p: 'Um pagamento é criado e depois aprovado, manualmente ou por aprovação automática.', links: [['Como funciona', '/docs/payment/payment-how-it-works']] },
    { b: 'Use o mesmo correlationID nas retentativas', p: 'O correlationID é a chave de idempotência: um ID novo para o mesmo pagamento cria um pagamento duplicado.', links: [['Correlation ID', '/docs/concepts/correlation-id']] },
  ] };
  if (!wizardDone(ans)) return null;
  const steps = [
    { b: 'Gere um AppID', p: 'Em API/Plugins na plataforma. Ele vai no header Authorization de toda chamada.', chips: [['Authorization: <AppID>', '']] },
  ];
  if (ans.confirm === 'webhook') steps.push({ b: 'Cadastre um webhook', p: 'Aponte para uma URL do seu backend. Ao salvar, a Woovi envia um evento de teste: responda 200.', chips: [['OPENPIX:CHARGE_COMPLETED', 'evt'], ['OPENPIX:CHARGE_EXPIRED', 'evt']], links: [['Webhook via API', '/docs/webhook/webhook-api']] });
  steps.push({ b: 'Crie a cobrança', p: 'value em centavos e um correlationID único seu (o ID do pedido, por exemplo). Reenviar com o mesmo correlationID não cria outra cobrança.' + (ans.split === 'yes' ? ' Inclua o array splits com as partes de cada conta.' : ''), chips: [['POST /api/v1/charge', 'post']], links: ans.split === 'yes' ? [['Cobrança com split', '/docs/charge/how-to-create-charge-with-split-using-api']] : [['Criar cobrança via API', '/docs/charge/how-to-create-charge-using-api']] });
  steps.push(ans.where === 'own'
    ? { b: 'Mostre o QR Code e o copia e cola', p: 'Use qrCodeImage para a imagem e brCode para o botão de copiar.', chips: [['charge.brCode', ''], ['charge.qrCodeImage', '']] }
    : { b: 'Redirecione para o link de pagamento', p: 'A página da Woovi mostra o QR Code e acompanha o pagamento por você.', chips: [['charge.paymentLinkUrl', '']] });
  if (ans.confirm === 'webhook') steps.push({ b: 'Receba o webhook e valide a assinatura', p: 'Verifique x-webhook-signature com a chave pública da Woovi sobre o corpo bruto. Responda 200 em até 100 s; um erro dispara até 8 tentativas.', chips: [['x-webhook-signature', '']], links: [['Validar assinatura', '/docs/webhook/seguranca/webhook-signature-validation'], ['Retentativas', '/docs/webhook/webhook-retry']] });
  else steps.push({ b: 'Consulte a cobrança até ela mudar de estado', p: 'Pare de consultar quando o status for COMPLETED ou EXPIRED. Consultas frequentes demais podem esbarrar no limite de requisições.', chips: [['GET /api/v1/charge/{id}', 'post']] });

function Discover({ ans, setAns, go }) {
  const graph = useMemo(() => buildWizardGraph(ans), [ans]);
  const path = pathOf(ans);
  const current = path.find(q => !ans[q.id]);
  const recipe = recipeFor(ans);
  const answer = (qid, oid) => {
    const qi = QUESTIONS.findIndex(q => q.id === qid);
    const next = {};
    QUESTIONS.forEach((q, i) => { if (i < qi && ans[q.id]) next[q.id] = ans[q.id]; });
    next[qid] = oid;
    setAns(next);
  };
  const onNodeClick = (_, n) => {
    if (n.type === 'o' && n.data.state !== 'locked') answer(n.data.qid, n.id.split('-').slice(2).join('-'));
  };
  const rf = useRef(null);
  useEffect(() => { const t = setTimeout(() => rf.current && rf.current.fitView({ padding: .12, duration: 300 }), 30); return () => clearTimeout(t); }, [ans.goal]);

  return html`<div class="wiz">
    <div class="wiz-side">
      ${Object.keys(ans).length ? html`<div class="trail" aria-label="Suas respostas">
        ${path.filter(q => ans[q.id]).map(q => { const o = q.opts.find(x => x.id === ans[q.id]); return html`<button key=${q.id} onClick=${() => { const nx = {}; QUESTIONS.slice(0, QUESTIONS.indexOf(q)).forEach(p => { if (ans[p.id]) nx[p.id] = ans[p.id]; }); setAns(nx); }} title="Mudar esta resposta">${o.label} ✕</button>`; })}
      </div>` : null}
      ${current ? html`<div class="panel qcard">
        <div class="qn">Pergunta ${QUESTIONS.indexOf(current) + 1} de ${ans.goal === 'charge' || !ans.goal ? QUESTIONS.length : 1}</div>
        <h3 style=${{ fontSize: 20 }}>${current.q}</h3>
        <div class="opts">${current.opts.map(o => html`<button key=${o.id} class="opt" onClick=${() => answer(current.id, o.id)}><b>${o.label}</b>${o.hint ? html`<span>${o.hint}</span>` : null}</button>`)}</div>
      </div>` : null}
      ${recipe ? html`<div class="panel recipe">
        <div class="eyebrow">Sua receita</div>
        <h3 style=${{ fontSize: 20 }}>${recipe.title}</h3>
        <ol>${recipe.steps.map((s, i) => html`<li key=${i}><div><b>${s.b}</b><p>${s.p}</p>
          ${(s.chips || s.links) ? html`<div class="row">
            ${(s.chips || []).map(([c, k]) => html`<span key=${c} class=${'chip ' + k}>${c}</span>`)}
            ${(s.links || []).map(([l, h]) => html`<a key=${h} href=${DOCS + h} target="_blank" rel="noopener" style=${{ fontSize: 13 }}>${l} ↗</a>`)}
          </div>` : null}</div></li>`)}</ol>
        ${recipe.charge ? html`<div class="recipe-actions">
          <button class="btn primary" onClick=${() => go('sequencia', ans.confirm === 'webhook' ? 'paid' : 'poll')}>Ver o fluxo passo a passo</button>
          <button class="btn" onClick=${() => go('laboratorio')}>Testar no playground</button>
        </div>` : null}
      </div>` : null}
    </div>
    <div class="flow" aria-label="Mapa das perguntas">
      <${Flow} nodes=${graph.nodes} edges=${graph.edges} nodeTypes=${wizNodeTypes} onNodeClick=${onNodeClick}
        onInit=${i => { rf.current = i; i.fitView({ padding: .12 }); }} fitView=${true} fitViewOptions=${{ padding: .12 }}
        nodesDraggable=${false} nodesConnectable=${false} elementsSelectable=${false}
        zoomOnScroll=${false} preventScrolling=${false} panOnScroll=${false} minZoom=${.3} maxZoom=${1.6} proOptions=${{ hideAttribution: true }}>
        <${Controls} showInteractive=${false} />
      <//>
    </div>
  </div>`;
}

function SequenceDiagram({ steps, cur, setCur }) {
  const W = 760, top = 64, rowH = 42;
  const X = { cli: 95, you: 290, woovi: 485, bank: 675 };
  const H = top + steps.length * rowH + 30;
  return html`<svg viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Diagrama de sequência">
    <defs>
      ${['', 'ink', 'acc', 'bad', 'warn'].map(c => html`<marker key=${c} id=${'ah' + c} viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class=${'arrowhead ' + c} /></marker>`)}
    </defs>
    ${ACTORS.map(a => html`<g key=${a.id}>
      <line class="life" x1=${X[a.id]} x2=${X[a.id]} y1="50" y2=${H - 6} />
      <rect class="actor-box" x=${X[a.id] - 72} y="6" width="144" height="42" rx="8" />
      <text class="actor-t" x=${X[a.id]} y="25" text-anchor="middle">${a.t}</text>
      <text class="actor-s" x=${X[a.id]} y="40" text-anchor="middle">${a.s}</text>
    </g>`)}
    ${steps.map((s, i) => {
      const y = top + i * rowH + 22;
      const state = i < cur ? 'past' : i === cur ? 'cur' : 'future';
      const cls = ['msg', state, s.kind === 'res' ? 'res' : '', s.bad ? 'bad' : '', s.kind === 'evt' ? 'evt' : ''].join(' ');
      const mk = state === 'cur' ? (s.bad ? 'bad' : s.kind === 'evt' ? 'warn' : 'acc') : state === 'past' ? (s.bad ? 'bad' : 'ink') : '';
      const hit = html`<rect class="hit" x="8" y=${y - 24} width=${W - 16} height=${rowH} rx="6" onClick=${() => setCur(i)} />`;
      const num = html`<text class="num" x="14" y=${y + 4}>${String(i + 1).padStart(2, '0')}</text>`;
      if (s.note) {
        const nx = X[s.note];
        return html`<g key=${i} class=${'note ' + cls}>${hit}${num}<rect x=${nx - 150} y=${y - 16} width="300" height="26" rx="6" /><text x=${nx} y=${y + 1} text-anchor="middle">${s.lbl}</text></g>`;
      }
      if (s.from === s.to) {
        const x = X[s.from];
        return html`<g key=${i} class=${cls}>${hit}${num}<path d=${`M${x},${y - 8} h36 v16 h-34`} marker-end=${`url(#ah${mk})`} /><text class="lbl" x=${x + 44} y=${y + 4}>${s.lbl}</text></g>`;
      }
      const x1 = X[s.from], x2 = X[s.to], dir = x2 > x1 ? 1 : -1;
      return html`<g key=${i} class=${cls} style=${s.optional ? { opacity: state === 'future' ? .15 : .6 } : null}>
        ${hit}${num}
        <line x1=${x1} y1=${y} x2=${x2 - dir * 2} y2=${y} marker-end=${`url(#ah${mk})`} style=${s.optional ? { strokeDasharray: '2 3' } : null} />
        <text class="lbl" x=${(x1 + x2) / 2} y=${y - 7} text-anchor="middle">${s.lbl}</text>
      </g>`;
    })}
  </svg>`;
}

function Sequence({ scenario, setScenario }) {
  const steps = SCENARIOS[scenario].steps;
  const [cur, setCur] = useState(0);
  const [playing, setPlaying] = useState(false);
  useEffect(() => { setCur(0); setPlaying(false); }, [scenario]);
  useEffect(() => {
    if (!playing) return;
    if (cur >= steps.length - 1) { setPlaying(false); return; }
    const t = setTimeout(() => setCur(c => c + 1), 1600);
    return () => clearTimeout(t);
  }, [playing, cur, steps.length]);
  useEffect(() => {
    const onKey = e => {
      if (!document.getElementById('sequencia')?.matches(':hover') || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key === 'ArrowRight') setCur(c => Math.min(c + 1, steps.length - 1));
      if (e.key === 'ArrowLeft') setCur(c => Math.max(c - 1, 0));
    };
    addEventListener('keydown', onKey); return () => removeEventListener('keydown', onKey);
  }, [steps.length]);
  const s = steps[cur];
  const who = s.note ? ACTORS.find(a => a.id === s.note).t : (s.from === s.to ? ACTORS.find(a => a.id === s.from).t : `${ACTORS.find(a => a.id === s.from).t} → ${ACTORS.find(a => a.id === s.to).t}`);
  return html`<div style=${{ display: 'grid', gap: 14 }}>
    <div class="seq-toolbar">
      <div class="seg" role="tablist" aria-label="Cenário">${Object.entries(SCENARIOS).map(([k, v]) => html`<button key=${k} role="tab" aria-selected=${k === scenario} class=${k === scenario ? 'on' : ''} onClick=${() => setScenario(k)}>${v.label}</button>`)}</div>
      <div class="seq-ctrl">
        <button class="btn ghost" aria-label="Passo anterior" disabled=${cur === 0} onClick=${() => { setPlaying(false); setCur(cur - 1); }}>←</button>
        <span class="count">${cur + 1} / ${steps.length}</span>
        <button class="btn ghost" aria-label="Próximo passo" disabled=${cur === steps.length - 1} onClick=${() => { setPlaying(false); setCur(cur + 1); }}>→</button>
        <button class="btn primary" onClick=${() => { if (cur >= steps.length - 1) setCur(0); setPlaying(!playing); }}>${playing ? 'Pausar' : 'Reproduzir'}</button>
      </div>
    </div>
    <div class="seq">
      <div class="panel seq-canvas"><${SequenceDiagram} steps=${steps} cur=${cur} setCur=${i => { setPlaying(false); setCur(i); }} /></div>
      <div class="panel step-card" aria-live="polite">
        <div class="who">Passo ${cur + 1} · ${who}</div>
        <h3 style=${{ fontSize: 20 }}>${s.title}</h3>
        ${s.p ? html`<p>${s.p}</p>` : null}
        ${s.code ? html`<${Code} src=${s.code} lang=${s.lang} />` : null}
        ${s.callout ? html`<div class=${'callout ' + s.callout[0]}>${s.callout[1]}</div>` : null}
      </div>
    </div>
  </div>`;
}

}
const HANDLER = [
  { label: 'Node.js · Express', lang: 'js', src: `import crypto from 'node:crypto';
import express from 'express';

// chave pública da Woovi em base64 (GET /api/v1/webhook/public-keys)
const WOOVI_PUBLIC_KEY = Buffer.from(process.env.WOOVI_PUBLIC_KEY_BASE64, 'base64').toString('ascii');

const app = express();

// corpo bruto: a assinatura é calculada sobre os bytes exatos
app.post('/webhooks/woovi', express.raw({ type: 'application/json' }), async (req, res) => {
  const signature = req.header('x-webhook-signature');
  const verify = crypto.createVerify('sha256');
  verify.write(req.body);
  verify.end();
  if (!signature || !verify.verify(WOOVI_PUBLIC_KEY, signature, 'base64')) {
    return res.sendStatus(401);
  }

  const { event, charge } = JSON.parse(req.body.toString());

  if (event === 'OPENPIX:CHARGE_COMPLETED') {
    // idempotente: o mesmo evento pode chegar mais de uma vez
    await db.orders.updateOne(
      { correlationID: charge.correlationID, status: { $ne: 'PAID' } },
      { $set: { status: 'PAID', paidAt: charge.paidAt } },
    );
  }

  if (event === 'OPENPIX:CHARGE_EXPIRED') {
    await db.orders.updateOne(
      { correlationID: charge.correlationID, status: 'PENDING' },
      { $set: { status: 'EXPIRED' } },
    );
  }

  res.sendStatus(200); // em até 100 s; trabalho pesado vai para uma fila
});` },
  { label: 'PHP', lang: 'php', src: `<?php
$payload = file_get_contents('php://input'); // corpo bruto
$signature = $_SERVER['HTTP_X_WEBHOOK_SIGNATURE'] ?? '';
$publicKey = base64_decode(getenv('WOOVI_PUBLIC_KEY_BASE64'));

$ok = openssl_verify($payload, base64_decode($signature), $publicKey, 'sha256WithRSAEncryption');
if ($ok !== 1) { http_response_code(401); exit; }

$data = json_decode($payload, true);
if ($data['event'] === 'OPENPIX:CHARGE_COMPLETED') {
  // idempotente: só muda se ainda não estiver pago
  $stmt = $pdo->prepare("UPDATE orders SET status = 'PAID' WHERE correlation_id = ? AND status <> 'PAID'");
  $stmt->execute([$data['charge']['correlationID']]);
}
http_response_code(200);` },
];

function Lab() {
  const [f, setF] = useState(() => ({ value: 5000, correlationID: 'pedido-' + hex(6), comment: 'Pedido #1042', expiresIn: '3600' }));
  const [charge, setCharge] = useState(null);
  const [last, setLast] = useState(null);
  const [log, setLog] = useState([]);
  const [open, setOpen] = useState(null);
  const [failFirst, setFailFirst] = useState(false);
  const [payerDiff, setPayerDiff] = useState(false);
  const t0 = useRef(Date.now());
  const status = charge ? charge.status : 'NONE';
  const at = () => { const s = Math.round((Date.now() - t0.current) / 1000); return `+${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  const push = e => { setLog(l => [{ ...e, id: uuid(), t: at() }, ...l]); };
  const upd = (k, v) => setF(x => ({ ...x, [k]: v }));
  const fakeSig = () => btoa(hex(96)).replace(/=+$/, '').slice(0, 172) + '=';

  const create = () => {
    if (!(f.value > 0) || !f.correlationID.trim()) return;
    if (charge && charge.correlationID === f.correlationID) {
      push({ kind: 'api', title: 'POST /api/v1/charge', note: 'mesmo correlationID: a cobrança existente foi devolvida', ok: '200', body: J({ charge: { status: charge.status, correlationID: charge.correlationID } }) });
      return;
    }
    const identifier = hex(32);
    const now = new Date();
    const c = {
      value: f.value, comment: f.comment, identifier, correlationID: f.correlationID, transactionID: identifier,
      status: 'ACTIVE', expiresIn: Number(f.expiresIn), type: 'DYNAMIC',
      expiresDate: new Date(now.getTime() + Number(f.expiresIn) * 1000).toISOString(), createdAt: now.toISOString(),
      paymentLinkUrl: 'https://woovi.com/pay/' + uuid(),
      qrCodeImage: 'https://api.woovi.com/openpix/charge/brcode/image/' + identifier + '.png',
      brCode: buildBrCode(f.value, identifier),
    };
    t0.current = Date.now();
    setCharge(c); setLast('create'); setOpen(null);
    setLog([]);
    setTimeout(() => {
      setLog([
        { id: uuid(), t: '+00:00', kind: 'hook', title: 'OPENPIX:CHARGE_CREATED', ok: '200', body: J({ event: 'OPENPIX:CHARGE_CREATED', charge: { status: 'ACTIVE', correlationID: c.correlationID, value: c.value } }) },
        { id: uuid(), t: '+00:00', kind: 'api', title: 'POST /api/v1/charge', ok: '200', body: J({ charge: c, correlationID: c.correlationID, brCode: c.brCode }) },
      ]);
    }, 0);
  };
  const pay = () => {
    const paidAt = new Date().toISOString();
    const e2e = 'E' + hex(32);
    const c = { ...charge, status: 'COMPLETED', paidAt, updatedAt: paidAt, payer: { name: payerDiff ? 'Maria Souza' : 'João Silva', taxID: { taxID: payerDiff ? '98765432100' : '12345678909', type: 'BR:CPF' } } };
    setCharge(c); setLast('pay');
    const payload = { event: 'OPENPIX:CHARGE_COMPLETED', charge: { status: c.status, value: c.value, correlationID: c.correlationID, transactionID: c.transactionID, paidAt, payer: c.payer }, pix: { value: c.value, time: paidAt, endToEndId: e2e, transactionID: c.transactionID, type: 'PAYMENT' }, company: { name: 'Loja Exemplo' } };
    const headers = `POST /webhooks/woovi HTTP/1.1\nHost: seusite.com.br\nContent-Type: application/json\nx-webhook-signature: ${fakeSig()}`;
    if (failFirst) {
      push({ kind: 'hook', title: 'OPENPIX:CHARGE_COMPLETED', ko: '500', note: 'tentativa 1 falhou; próxima em 10 s', body: headers + '\n\n' + J(payload) });
      setTimeout(() => push({ kind: 'hook', title: 'OPENPIX:CHARGE_COMPLETED', ok: '200', note: 'tentativa 2 entregue (simulação acelerada)', body: headers + '\n\n' + J(payload) }), 1800);
    } else {
      push({ kind: 'hook', title: 'OPENPIX:CHARGE_COMPLETED', ok: '200', body: headers + '\n\n' + J(payload) });
    }
    if (payerDiff) push({ kind: 'hook', title: 'OPENPIX:CHARGE_COMPLETED_NOT_SAME_CUSTOMER_PAYER', ok: '200', note: 'quem pagou não é o customer da cobrança', body: J({ event: 'OPENPIX:CHARGE_COMPLETED_NOT_SAME_CUSTOMER_PAYER', charge: { correlationID: c.correlationID, payer: c.payer } }) });
  };
  const expire = () => {
    const c = { ...charge, status: 'EXPIRED', updatedAt: new Date().toISOString() };
    setCharge(c); setLast('expire');
    push({ kind: 'hook', title: 'OPENPIX:CHARGE_EXPIRED', ok: '200', note: `simulando o fim dos ${Number(charge.expiresIn) / 60} min`, body: J({ event: 'OPENPIX:CHARGE_EXPIRED', charge: { status: 'EXPIRED', correlationID: c.correlationID, expiresDate: c.expiresDate } }) });
  };
  const reset = () => { setCharge(null); setLast(null); setLog([]); setOpen(null); upd('correlationID', 'pedido-' + hex(6)); };
  const qr = useMemo(() => charge ? qrSvg(charge.brCode) : '', [charge && charge.brCode]);
  const why = status === 'NONE' ? 'Crie a cobrança para liberar o pagamento.' : status === 'COMPLETED' ? 'Uma cobrança aceita um único pagamento. Para cobrar de novo, crie outra.' : status === 'EXPIRED' ? 'Cobrança expirada não volta a ficar ativa. Crie uma nova.' : 'Escolha o que acontece com a cobrança.';

  return html`<div class="lab">
    <div class="lab-col">
      <form class="panel form" onSubmit=${e => { e.preventDefault(); create(); }}>
        <div style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
          <h3><span class="chip post">POST</span> /api/v1/charge</h3>
          <span class="sim-pill">simulado · nada sai do navegador</span>
        </div>
        <div class="fields">
          <div class="field">
            <label for="pg-value">Valor <code>value</code></label>
            <input id="pg-value" type="number" min="1" step="1" value=${f.value} onInput=${e => upd('value', Math.max(0, parseInt(e.target.value || '0', 10)))} />
            <span class="hint">em centavos · ${brl(f.value || 0)}</span>
          </div>
          <div class="field">
            <label for="pg-exp">Expira em <code>expiresIn</code></label>
            <select id="pg-exp" value=${f.expiresIn} onChange=${e => upd('expiresIn', e.target.value)}>
              <option value="900">15 minutos (900 s)</option>
              <option value="3600">1 hora (3600 s)</option>
              <option value="86400">24 horas (86400 s)</option>
            </select>
            <span class="hint">em segundos</span>
          </div>
          <div class="field wide">
            <label for="pg-cid">Identificador <code>correlationID</code></label>
            <div class="inline">
              <input id="pg-cid" value=${f.correlationID} onInput=${e => upd('correlationID', e.target.value)} />
              <button type="button" class="btn" onClick=${() => upd('correlationID', uuid())}>Novo UUID</button>
            </div>
            <span class="hint">Único por cobrança. Envie de novo o mesmo valor e veja a idempotência no log.</span>
          </div>
          <div class="field wide">
            <label for="pg-comment">Comentário <code>comment</code></label>
            <input id="pg-comment" value=${f.comment} onInput=${e => upd('comment', e.target.value)} />
          </div>
        </div>
        <${CodeTabs} tabs=${snippets(f)} />
        <div class="actions"><button type="submit" class="btn primary" disabled=${!(f.value > 0) || !f.correlationID.trim()}>Criar cobrança</button>
          ${charge ? html`<button type="button" class="btn ghost" onClick=${reset}>Recomeçar</button>` : null}</div>
      </form>

      <div class="panel form">
        <h3>Seu endpoint de webhook</h3>
        <p style=${{ color: 'var(--muted)', fontSize: 13.5 }}>O código que recebe os eventos da direita. Valide a assinatura, dê baixa de forma idempotente, responda 200.</p>
        <${CodeTabs} tabs=${HANDLER} />
      </div>
    </div>

    <div class="lab-col">
      <${StateMachine} status=${status} last=${last} />
      <div class="panel form">
        <div style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
          <h3>Cobrança</h3><span class=${'status ' + status}>${status === 'NONE' ? 'não criada' : status}</span>
        </div>
        <div class="qr-row">
          ${charge ? html`<div class="qr-tile" dangerouslySetInnerHTML=${{ __html: qr }} aria-label="QR Code Pix simulado"></div>`
            : html`<div class="qr-tile empty">O QR Code aparece aqui depois do POST.</div>`}
          <div style=${{ display: 'grid', gap: 8, minWidth: 0 }}>
            ${charge ? html`<dl class="kv">
              <dt>valor</dt><dd>${brl(charge.value)}</dd>
              <dt>correlationID</dt><dd>${charge.correlationID}</dd>
              <dt>expiresDate</dt><dd>${new Date(charge.expiresDate).toLocaleString('pt-BR')}</dd>
              ${charge.paidAt ? html`<dt>paidAt</dt><dd>${new Date(charge.paidAt).toLocaleString('pt-BR')}</dd>` : null}
            </dl>
            <div class="brcode" title="brCode (copia e cola)">${charge.brCode}</div>`
            : html`<p style=${{ color: 'var(--muted)', fontSize: 13.5 }}>Preencha o formulário e crie a cobrança. O brCode gerado segue o padrão EMV do Pix, com CRC16 válido, mas aponta para uma conta de teste.</p>`}
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" disabled=${status !== 'ACTIVE'} onClick=${pay}>Simular pagamento</button>
          <button class="btn" disabled=${status !== 'ACTIVE'} onClick=${expire}>Simular expiração</button>
        </div>
        <div style=${{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
          <label class="toggle" for="pg-fail"><input id="pg-fail" type="checkbox" checked=${failFirst} onChange=${e => setFailFirst(e.target.checked)} /> Meu endpoint falha na 1ª entrega</label>
          <label class="toggle" for="pg-payer"><input id="pg-payer" type="checkbox" checked=${payerDiff} onChange=${e => setPayerDiff(e.target.checked)} /> Outra pessoa paga</label>
        </div>
        <p class="why" style=${{ fontSize: 12.5, color: 'var(--muted)' }}>${why}</p>
      </div>

      <div class="panel log">
        <div class="log-head"><h3>Chamadas e eventos</h3><span class="mono" style=${{ fontSize: 11.5, color: 'var(--muted)' }}>mais recente primeiro</span></div>
        ${log.length ? html`<ul>${log.map(e => html`<li key=${e.id}>
          <button class="log-row" aria-expanded=${open === e.id} onClick=${() => setOpen(open === e.id ? null : e.id)}>
            <span class="t">${e.t}</span>
            <span style=${{ minWidth: 0 }}><span class=${'chip ' + (e.kind === 'hook' ? 'evt' : 'post')}>${e.kind === 'hook' ? 'webhook' : 'api'}</span> <span class="mono" style=${{ overflowWrap: 'anywhere' }}>${e.title}</span>${e.note ? html`<br/><span style=${{ color: 'var(--muted)', fontSize: 12.5 }}>${e.note}</span>` : null}</span>
            ${e.ok ? html`<span class="ok">${e.ok}</span>` : html`<span class="ko">${e.ko}</span>`}
          </button>
          ${open === e.id ? html`<div class="log-body"><${Code} src=${e.body} lang=${e.body.trim().startsWith('{') ? 'json' : 'txt'} /></div>` : null}
        </li>`)}</ul>` : html`<div class="empty">Nada ainda. Cada chamada à API e cada webhook que a Woovi enviaria aparecem aqui, com o payload.</div>`}
      </div>
    </div>
  </div>`;
}

/* =========================================================
   App
   ========================================================= */
const CHAPTERS = [['descobrir', 'O que integrar'], ['sequencia', 'Sequência'], ['laboratorio', 'Estados e playground']];
function App() {
  const [ans, setAns] = useState(() => { try { return JSON.parse(localStorage.getItem('wv-ans') || 'null') || { goal: 'charge', where: 'own' }; } catch (e) { return { goal: 'charge', where: 'own' }; } });
  const [scenario, setScenario] = useState('paid');
  const [active, setActive] = useState('descobrir');
  useEffect(() => { try { localStorage.setItem('wv-ans', JSON.stringify(ans)); } catch (e) {} }, [ans]);
  useEffect(() => {
    const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && setActive(e.target.id)), { rootMargin: '-40% 0px -55% 0px' });
    CHAPTERS.forEach(([id]) => { const el = document.getElementById(id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, []);
  const go = (id, sc) => { if (sc) setScenario(sc); document.getElementById(id)?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); };

  return html`<div class="wrap">
    <header class="top">
      <div class="brand"><span class="brand-mark">w</span>woovi <small>/ developers</small></div>
      <span class="sim-pill">protótipo · docs interativas</span>
    </header>
    <div class="hero">
      <div class="eyebrow">Guia de integração · Cobrança Pix</div>
      <h1>Do <em>POST /charge</em> ao <em>CHARGE_COMPLETED</em></h1>
      <p class="lede">Responda quatro perguntas e receba o roteiro da sua integração. Depois veja cada mensagem trocada entre seu sistema, a Woovi e o banco, e teste a cobrança num playground que não sai do navegador.</p>
    </div>
    <nav class="chapters" aria-label="Capítulos"><ol>${CHAPTERS.map(([id, t], i) => html`<li key=${id}><a href=${'#' + id} class=${active === id ? 'on' : ''} onClick=${e => { e.preventDefault(); go(id); }}><span class="n">${String(i + 1).padStart(2, '0')}</span>${t}</a></li>`)}</ol></nav>

    <section class="ch" id="descobrir">
      <div class="ch-head"><div class="eyebrow">01 · Descobrir</div><h2>O que você precisa integrar?</h2>
        <p class="lede">Cada resposta acende um caminho no mapa. Clique nas opções da lista ou direto nos nós do mapa.</p></div>
      <${Discover} ans=${ans} setAns=${setAns} go=${go} />
    </section>

    <section class="ch" id="sequencia">
      <div class="ch-head"><div class="eyebrow">02 · Sequência</div><h2>Quem fala com quem, e quando</h2>
        <p class="lede">Avance passo a passo com as setas (ou ← → no teclado) e troque de cenário para ver o que muda quando o webhook falha ou a cobrança expira.</p></div>
      <${Sequence} scenario=${scenario} setScenario=${setScenario} />
    </section>

    <section class="ch" id="laboratorio">
      <div class="ch-head"><div class="eyebrow">03 · Estados e playground</div><h2>Uma cobrança tem três estados</h2>
        <p class="lede">ACTIVE ao nascer, depois COMPLETED quando o Pix chega ou EXPIRED quando o prazo acaba. Os dois últimos são finais. Crie uma cobrança e acompanhe a máquina de estados reagir a cada evento.</p></div>
      <${Lab} />
    </section>

    <footer>
      <span>Protótipo de documentação interativa. Payloads baseados nos exemplos de developers.woovi.com; assinaturas e IDs são fictícios.</span>
      <a href=${DOCS + '/docs/charge/how-to-create-charge-using-api'} target="_blank" rel="noopener">Documentação oficial ↗</a>
    </footer>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
